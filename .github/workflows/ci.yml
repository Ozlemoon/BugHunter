name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=core --cov=web --cov-report=term-missing

  demo-scan:
    # Dogfooding: scan the bundled buggy targets exactly the way a user's pipeline would.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start demo targets
        run: |
          python main.py playground --no-reload &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/ && curl -sf http://127.0.0.1:8002/ && break; sleep 1; done
      - name: Scan demo API and web app
        run: |
          python main.py scan --url http://127.0.0.1:8001/openapi.json --auth "Bearer admin-token" \
            --junit reports/api.xml --html reports/api.html --fail-on NEVER
          python main.py scan --type WEB --url http://127.0.0.1:8002/ \
            --junit reports/web.xml --html reports/web.html --fail-on NEVER
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bughunter-demo-reports
          path: reports/
