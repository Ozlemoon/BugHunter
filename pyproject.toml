[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bughunter-ai"
version = "1.1.0"
description = "Human-in-the-loop autonomous API & web testing agent with evidence, safe patches and regression checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ozlem Babatutmaz" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
rag = ["chromadb>=1.5.9,<2", "langchain-ollama>=1.1,<2"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
bughunter = "main:main"

[project.urls]
Repository = "https://github.com/Ozlemoon/BugHunter"

[tool.setuptools]
py-modules = ["main", "cli"]
packages = ["core", "core.targets", "web", "playground"]

[tool.setuptools.package-data]
web = ["templates/*.html"]
playground = ["templates/*.html"]
core = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["playground/*.bughunter.bak"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
# HTTPException is imported for the fixes BugHunter proposes to these deliberately buggy files.
"playground/*" = ["B904", "F401"]
