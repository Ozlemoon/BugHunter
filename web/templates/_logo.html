{#- BugHunter logo: a beetle caught in a target reticle, on a navy tile.
    The gradient id is per call so several logos can share one page. -#}
{% macro logo(size=36, uid="bh") -%}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="{{ size }}" height="{{ size }}" role="img" aria-label="BugHunter logosu">
    <defs>
        <linearGradient id="{{ uid }}-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e3a8a"/>
            <stop offset="1" stop-color="#2563eb"/>
        </linearGradient>
    </defs>
    <rect width="48" height="48" rx="11" fill="url(#{{ uid }}-tile)"/>
    <g fill="none" stroke="#fff" stroke-linecap="round">
        <circle cx="24" cy="24" r="15" stroke-width="2" stroke-opacity=".9"/>
        <path d="M24 4.5v5.5M24 38v5.5M4.5 24h5.5M38 24h5.5" stroke-width="2.2"/>
        <path d="M19 22.5l-3.6-2.2M18.6 26.5h-4M19 30.5l-3.6 2.4M29 22.5l3.6-2.2M29.4 26.5h4M29 30.5l3.6 2.4M22.6 15.6l-1.8-2.6M25.4 15.6l1.8-2.6" stroke-width="1.6"/>
    </g>
    <circle cx="24" cy="17.8" r="2.7" fill="#fff"/>
    <ellipse cx="24" cy="26.6" rx="5.6" ry="7.2" fill="#fff"/>
    <path d="M24 20.6v13" stroke="#1e3a8a" stroke-width="1.3" stroke-linecap="round"/>
</svg>
{%- endmacro %}
